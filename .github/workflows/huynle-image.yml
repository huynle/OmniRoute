name: huynle image

# Fork-only: build the patched runner-base image (same target as upstream's
# `diegosouzapw/omniroute:<version>`) for linux/amd64 + linux/arm64 and push a
# multi-arch manifest to ghcr.io/huynle/omniroute:<tag>.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (e.g. 3.8.51-thinking.1)
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/huynle/omniroute

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner-base
          platforms: ${{ matrix.platform }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in *[!A-Za-z0-9._-]*|"") echo "invalid tag" >&2; exit 1;; esac
          refs=""
          for f in /tmp/digests/*; do refs="$refs ${IMAGE}@$(cat "$f")"; done
          docker buildx imagetools create -t "${IMAGE}:${TAG}" $refs
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          echo "### ${IMAGE}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest.Digest}}' >> "$GITHUB_STEP_SUMMARY"
